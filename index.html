<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>coffee House</title>
  </head>
  <body>
    <header>
      <a href="index.html" id="logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
        >
          <path d="M0 0h24v24H0z" fill="none" />
          <path
            d="M11.41 11.77c0-3.43 2.59-6.25 6.03-6.56l2.9-.26c-.19-.24-.39-.47-.61-.69C16.24.77 9.93 1.4 5.67 5.67c-2.04 2.04-3.32 4.6-3.61 7.21c-.17 1.53.02 2.96.52 4.24l4.97-.82c2.24-.37 3.87-2.27 3.87-4.52Z"
          />
          <path
            d="M17.62 7.21c-2.4.22-4.21 2.18-4.21 4.57c0 3.23-2.33 5.97-5.54 6.5l-4.26.7c.2.26.42.52.66.76c1.48 1.48 3.49 2.27 5.74 2.27q.555 0 1.11-.06c2.61-.29 5.18-1.57 7.21-3.61s3.32-4.6 3.61-7.21c.17-1.53-.02-2.97-.52-4.25l-3.79.34Z"
          />
        </svg>
        Coffee House
      </a>

      <input type="checkbox" id="menu-toggle" />

      <label for="menu-toggle" class="burger">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav id="navbar">
        <ul>
          <li><a href="index.html" class="home active">Home</a></li>
          <li><a href="./pages/menu.html" class="menu">Menu</a></li>
          <li><a href="./pages/contact.html" class="contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <section id="hero">
      <div class="hero-container">
        <div class="welcome-text">
          <h1>Welcome to Coffee House</h1>
        </div>
        <div class="welcome-subtext">
          <p>
            Discover the finest coffee blends and experience the art of brewing.
          </p>
        </div>
        <div class="menu-btn-container">
          <a href="./pages/menu.html" class="menu-btn">View Menu</a>
        </div>

        <div class="special-offer-card-container">
          <div class="special-offer-card-img">
            <img
              src="./imgs/todaysOfferpng.png"
              alt="Today's Offer coffee"
              class="special-offer-image"
            />
          </div>

          <div class="special-offer-card-text">
            <h2>Today's Special Offer</h2>
            <p>Get 20% off on our signature Espresso Blend!</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
